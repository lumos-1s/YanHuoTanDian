server:
  port: 8081
  servlet:
    encoding:
          charset: UTF-8
          enabled: true
          force: true
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 192.168.116.130
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
# ===== AI 配置（第2、3步新增）=====
ark:
  # API Key 从环境变量读取，不写明文（防 git 提交泄露）；IDEA 运行配置里加 ARK_API_KEY
  api-key: ${ARK_API_KEY:}
  chat-model: doubao-seed-2-0-lite-260428

